[project]
name = "info-anonymizer"
version = "0.1.0"
description = "Local app that pseudonymizes personal data from documents issued in Germany."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web backend
    "fastapi>=0.163",
    "uvicorn>=0.54",
    "python-multipart>=0.0.33",
    # OCR
    "paddleocr>=3.7",
    "onnxruntime>=1.32",
    "pytesseract>=0.3.13",
    "pypdfium2>=5.15",
    # Local LLM
    "ollama>=0.6.3",
    # Pseudonyms and settings
    "faker>=40.54",
    "pyyaml>=6.0",  # paddlex pins pyyaml==6.0.2
]

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[tool.uv]
# This is an application, not a library to publish.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs OCR models and specimen images (deselect with -m \"not slow\")"]
